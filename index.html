<body>
  <div id="root"></div>
  <script>
    (function () {
      const NOISE_PATTERNS = [
        /channel secret not available yet/i,
        /extendedbroadcastmessage/i,
        /providersmanager/i,
        /inpage\.js/i,
      ];

      const stringifyArg = (arg) => {
        if (typeof arg === 'string') return arg;
        if (arg instanceof Error) return arg.message;
        if (arg && typeof arg === 'object') {
          try {
            return JSON.stringify(arg);
          } catch {
            return String(arg);
          }
        }
        return String(arg);
      };

      const shouldSuppress = (message) => NOISE_PATTERNS.some((pattern) => pattern.test(message));

      const originalConsoleError = console.error.bind(console);
      console.error = function (...args) {
        const message = args.map(stringifyArg).join(' ');
        if (shouldSuppress(message)) return;
        originalConsoleError(...args);
      };

      window.addEventListener('error', function (event) {
        const message = [event?.message, event?.error?.message, event?.error?.stack]
          .filter(Boolean)
          .join(' ');
        if (shouldSuppress(message)) {
          event.preventDefault();
        }
      });
    })();
  </script>
