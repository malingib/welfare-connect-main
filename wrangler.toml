# Cloudflare Workers (Static Assets) — serves the Vite SPA in ./dist.
# Workers Builds: build command `bun run build`, deploy command `npx wrangler deploy`.
# Required build variables (Cloudflare dashboard → Settings → Variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (inlined at build time)

name = "welfare-connect-main"
compatibility_date = "2026-09-12"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
